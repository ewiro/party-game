name: Discover party game candidates

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: candidate-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: discover
        name: Scan Steam discovery sources
        run: node scripts/discover.mjs --github-output "$GITHUB_OUTPUT"
      - name: Validate candidate ledger
        run: node scripts/validate.mjs
      - name: Add report to workflow summary
        run: cat reports/discovery.md >> "$GITHUB_STEP_SUMMARY"
      - name: Persist discovery queue
        run: |
          if git diff --quiet -- data/candidates.tsv reports/discovery.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidates.tsv reports/discovery.md
          git commit -m "Update party game candidate queue"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Update candidate review issue
        if: steps.discover.outputs.pending != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '派对游戏候选审核 in:title' --json number --jq '.[0].number')"
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --body-file reports/discovery.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "派对游戏候选审核" --body-file reports/discovery.md
          fi
